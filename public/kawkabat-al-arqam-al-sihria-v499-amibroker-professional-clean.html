<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبة الأرقام السحرية V499 — AmiBroker Professional Link</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f1e3}#wheelFrame{display:block;width:100%;height:100%;border:0}
#liveBoard{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647;min-width:430px;height:48px;display:flex;align-items:center;justify-content:center;gap:11px;padding:0 16px;border:1px solid #a37825;border-radius:11px;background:#fff7dc;color:#67490e;font:900 14px Arial;direction:ltr;box-shadow:0 2px 10px #0004;pointer-events:none}
#liveBoard[data-state=up]{background:#dcffe6;color:#08682a;border-color:#159b43}#liveBoard[data-state=down]{background:#ffe1e4;color:#a3101c;border-color:#d32639}#liveBoard[data-state=stale]{background:#fff0d6;color:#754b00;border-color:#c7831c}.price{font-size:22px;min-width:105px;text-align:center}.age{font-size:11px;opacity:.78}
</style></head><body>
<div id="liveBoard" data-state="stale"><span>XAUUSD</span><span class="price">--.--</span><span class="arrow">•</span><span class="status">WAITING FOR AMIBROKER</span><span class="age">8768</span></div>
<iframe id="wheelFrame" title="كوكبة الأرقام السحرية" src="https://htmlpreview.github.io/?https://github.com/KawkabatSeherAlarqam-Org/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v451-separate-east-gems-gates.html"></iframe>
<script>(function(){'use strict';
const ENDPOINT='http://127.0.0.1:8768/quote',POLL=150,TIMEOUT=900,STALE=1800,GREEN='#20C85A',RED='#E53945';
const frame=document.getElementById('wheelFrame'),board=document.getElementById('liveBoard');let busy=false,lastSeq=-1,lastPrice=null,lastDirection='UP',lastGood=0,lastPaintKey='',success=0,errors=0;
function visit(doc,fn,depth=0){if(!doc||depth>40)return null;const hit=fn(doc);if(hit)return hit;for(const f of doc.querySelectorAll('iframe')){try{const x=visit(f.contentDocument,fn,depth+1);if(x)return x}catch(_){}}return null}
function wheelDoc(){try{return visit(frame.contentDocument,d=>d.getElementById('wheel')&&d.querySelector('.approved-cycle-number[data-tick]')?d:null)}catch(_){return null}}
function number(v){const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};const n=Number(String(v??'').replace(/[٠-٩]/g,d=>map[d]).replace(/,/g,'').trim());return Number.isFinite(n)?n:null}
function nodeValue(n){const p=n.querySelector('tspan[data-v131-number-role="primary"]');for(const v of [n.dataset.v131DisplayValue,p&&p.textContent,n.textContent]){const x=number(v);if(x!==null)return x}return null}
function findCell(d,price){const target=Math.floor(price);let best=null,delta=Infinity;for(const n of d.querySelectorAll('.approved-cycle-number[data-tick]')){const v=nodeValue(n);if(v===null)continue;const x=Math.abs(v-target);if(x<delta){delta=x;best=n;if(x===0)break}}return delta<=.51?best:null}
function findPath(d,node){const tick=String(node.dataset.tick||node.getAttribute('data-tick')||'');for(const p of d.querySelectorAll('#v131CellColorLayer path[data-v131-cell-key]'))if(String(p.dataset.v131CellKey||p.getAttribute('data-v131-cell-key')||'').endsWith('|'+tick))return p;return null}
function clear(d){if(!d)return;const old=d.getElementById('v499LiveCell');if(old)old.remove()}
function paintCell(price,direction){const d=wheelDoc();if(!d)return false;const node=findCell(d,price);clear(d);if(!node)return false;const wheel=d.getElementById('wheel'),src=findPath(d,node),x=Number(node.getAttribute('x')),y=Number(node.getAttribute('y')),color=direction==='DOWN'?RED:GREEN,NS='http://www.w3.org/2000/svg',g=d.createElementNS(NS,'g');g.id='v499LiveCell';g.style.pointerEvents='none';g.dataset.price=price.toFixed(2);g.dataset.direction=direction;
if(src){const p=src.cloneNode(false);p.removeAttribute('id');p.removeAttribute('data-v131-cell-key');p.style.setProperty('fill',color,'important');p.style.setProperty('fill-opacity','.9','important');p.style.setProperty('stroke',direction==='DOWN'?'#780711':'#056022','important');p.style.setProperty('stroke-width','5.2px','important');p.style.setProperty('filter','drop-shadow(0 0 14px '+color+')','important');g.appendChild(p)}
if(Number.isFinite(x)&&Number.isFinite(y)){const t=d.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y+18);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.style.setProperty('font','900 15px Arial','important');t.style.setProperty('fill','#fff','important');t.style.setProperty('stroke',direction==='DOWN'?'#65050d':'#064d1d','important');t.style.setProperty('paint-order','stroke','important');t.textContent=price.toFixed(2);g.appendChild(t)}wheel.appendChild(g);d.documentElement.dataset.amibrokerPrice=price.toFixed(2);d.documentElement.dataset.amibrokerDirection=direction;return true}
function paintBoard(state,price,direction,age){board.dataset.state=state;board.querySelector('.price').textContent=price==null?'--.--':price.toFixed(2);board.querySelector('.arrow').textContent=state==='stale'?'•':direction==='DOWN'?'▼':'▲';board.querySelector('.status').textContent=state==='stale'?'WAITING FOR AMIBROKER':direction==='DOWN'?'LIVE DOWN':'LIVE UP';board.querySelector('.age').textContent=state==='stale'?'8768':age+' ms'}
async function read(){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),TIMEOUT);try{const r=await fetch(ENDPOINT+'?_='+Date.now(),{cache:'no-store',credentials:'omit',signal:ctl.signal,headers:{Accept:'application/json','Cache-Control':'no-cache'}});if(!r.ok)throw Error('HTTP '+r.status);const q=await r.json(),price=number(q.price);if(price===null||price<=0||q.ok===false)throw Error(q.error||'INVALID_QUOTE');return{price,direction:String(q.direction||'').toUpperCase(),seq:Number(q.sequence??q.observedAt??0),observedAt:Number(q.observedAt||Date.now())}}finally{clearTimeout(timer)}}
async function poll(){if(busy)return;busy=true;try{const q=await read();if(q.seq&&q.seq<lastSeq)return;if(q.seq)lastSeq=q.seq;let dir=q.direction;if(dir!=='UP'&&dir!=='DOWN'){dir=lastPrice!==null&&q.price<lastPrice?'DOWN':lastPrice!==null&&q.price>lastPrice?'UP':lastDirection}lastPrice=q.price;lastDirection=dir;lastGood=Date.now();success++;const age=Math.max(0,Date.now()-q.observedAt);paintBoard(''+(dir==='DOWN'?'down':'up'),q.price,dir,age);const key=q.price.toFixed(6)+'|'+dir;if(key!==lastPaintKey||!wheelDoc()?.getElementById('v499LiveCell')){if(paintCell(q.price,dir))lastPaintKey=key}}catch(e){errors++;if(Date.now()-lastGood>STALE){paintBoard('stale',null,lastDirection,0);clear(wheelDoc())}}finally{busy=false}}
frame.addEventListener('load',()=>setTimeout(poll,250));setInterval(poll,POLL);poll();window.__auditV499=()=>({singleEndpoint:true,endpoint:ENDPOINT,pollMs:POLL,lastPrice,lastDirection,lastSeq,success,errors,stale:Date.now()-lastGood>STALE,wheelNumbersRewritten:false});
})();</script></body></html>
