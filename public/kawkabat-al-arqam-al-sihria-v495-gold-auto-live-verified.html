<script id="v495GoldAutoLive">
(function(){
'use strict';
var frame=document.getElementById('v495-frame'),board=document.getElementById('v495Board');
var ENDPOINTS=[
 'http://127.0.0.1:8768/quote','http://127.0.0.1:8768/live_quote.json',
 'http://localhost:8768/quote','http://localhost:8768/live_quote.json',

var GREEN='#20C85A',RED='#E53945';
var activeEndpoint=null,busy=false,lastPrice=null,lastDirection='UP',lastGood=0,lastCellTick=null,anchorApplied=false;
var success=0,errors=0,consecutiveFailures=0,scanIndex=0,lastError='';
function visit(doc,fn,depth){if(!doc||depth>800)return null;var hit=fn(doc);if(hit)return hit;var fs=doc.querySelectorAll('iframe');for(var i=0;i<fs.length;i++){try{var x=visit(fs[i].contentDocument,fn,depth+1);if(x)return x;}catch(e){}}return null;}
function root(){try{return frame.contentDocument;}catch(e){return null;}}
function controlDoc(){var r=root();return r&&visit(r,function(d){return d.querySelector('input[aria-label="Value"]')?d:null;},0);}
function wheelDoc(){var r=root();return r&&visit(r,function(d){return d.getElementById('wheel')&&d.querySelector('.approved-cycle-number[data-tick]')?d:null;},0);}
function western(v){var m={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};var t=String(v==null?'':v).replace(/[٠-٩۰-۹]/g,function(d){return m[d]||d;}).replace(/,/g,'').trim();var n=Number(t);return Number.isFinite(n)?n:null;}
function nodeValue(n){var p=n.querySelector('tspan[data-v131-number-role="primary"]'),a=[n.getAttribute('data-v131-display-value'),p&&p.textContent,n.textContent];for(var i=0;i<a.length;i++){var x=western(a[i]);if(x!==null)return x;}return null;}
function quoteData(j){if(j==null)return null;if(typeof j==='number'||typeof j==='string'){var s=western(j);return s!==null&&s>0?{price:s,direction:null,symbol:'XAUUSD'}:null;}var a=[j.price,j.last,j.close,j.value,j.ltp,j.LTP];if(j.quote)a.push(j.quote.price,j.quote.last,j.quote.close,j.quote.value,j.quote.ltp,j.quote.LTP);if(j.data)a.push(j.data.price,j.data.last,j.data.close,j.data.value,j.data.ltp,j.data.LTP);var p=null;for(var i=0;i<a.length;i++){var n=western(a[i]);if(n!==null&&n>0){p=n;break;}}if(p===null)return null;var d=String(j.direction||(j.quote&&j.quote.direction)||(j.data&&j.data.direction)||'').toUpperCase();if(d!=='UP'&&d!=='DOWN')d=null;return{price:p,direction:d,symbol:String(j.symbol||(j.quote&&j.quote.symbol)||(j.data&&j.data.symbol)||'XAUUSD').toUpperCase()};}
function nativeSet(input,value){var w=input.ownerDocument.defaultView,p=w.HTMLInputElement&&w.HTMLInputElement.prototype,ds=p&&Object.getOwnPropertyDescriptor(p,'value');if(ds&&ds.set)ds.set.call(input,String(value));else input.value=String(value);['input','change','keyup','blur'].forEach(function(n){input.dispatchEvent(new w.Event(n,{bubbles:true}));});}
function applyAnchor(price){if(anchorApplied)return true;var d=controlDoc(),input=d&&d.querySelector('input[aria-label="Value"]');if(!input)return false;var anchor=Math.max(1,Math.floor(Number(price)));var r=root(),engine=r&&visit(r,function(doc){var w=doc.defaultView;return w&&typeof w.__setKawkabatCanonicalValue==='function'?w:null;},0);if(engine)engine.__setKawkabatCanonicalValue(String(anchor));else nativeSet(input,String(anchor));anchorApplied=true;return true;}
function hideLegacy(){var r=root();if(!r)return;visit(r,function(d){var s=d.getElementById('v495HideLegacy');if(!s){s=d.createElement('style');s.id='v495HideLegacy';s.textContent='#v482CleanLiveStatus,#v489AmiBrokerSymbolSelector,#v490LowLatencyStatus{display:none!important}';d.head&&d.head.appendChild(s);}return null;},0);}
function findNode(doc,price){var target=Math.floor(Number(price)),nodes=doc.querySelectorAll('.approved-cycle-number[data-tick]'),best=null,bestDelta=Infinity;for(var i=0;i<nodes.length;i++){var v=nodeValue(nodes[i]);if(v===null)continue;var delta=Math.abs(v-target);if(delta<bestDelta){best=nodes[i];bestDelta=delta;}if(delta<1e-9)break;}return bestDelta<=0.51?best:null;}
function matchingPath(doc,node){var tick=String(node.getAttribute('data-tick')||''),paths=doc.querySelectorAll('#v131CellColorLayer path[data-v131-cell-key]');for(var i=0;i<paths.length;i++){var key=String(paths[i].getAttribute('data-v131-cell-key')||'');if(key.slice(-(tick.length+1))==='|'+tick)return paths[i];}var x=Number(node.getAttribute('x')),y=Number(node.getAttribute('y'));if(!Number.isFinite(x)||!Number.isFinite(y))return null;var ta=Math.atan2(y-1800,x-2200)*180/Math.PI,tr=Math.hypot(x-2200,y-1800),best=null,score=Infinity;for(var j=0;j<paths.length;j++){try{var b=paths[j].getBBox(),px=b.x+b.width/2,py=b.y+b.height/2,a=Math.atan2(py-1800,px-2200)*180/Math.PI,r=Math.hypot(px-2200,py-1800),da=Math.abs(a-ta);da=Math.min(da,360-da);var s=da*20+Math.abs(r-tr);if(s<score){score=s;best=paths[j];}}catch(e){}}return best;}
function removeOverlay(doc){var ids=['v484LivePriceCell','v486LivePriceCell','v490LivePriceCell','v493LivePriceCell','v494LivePriceCell','v495LivePriceCell'];for(var i=0;i<ids.length;i++){var old=doc&&doc.getElementById(ids[i]);if(old)old.remove();}}
function paintCell(price,direction){var d=wheelDoc();if(!d)return false;var node=findNode(d,price);if(!node){removeOverlay(d);lastCellTick=null;return false;}var src=matchingPath(d,node);if(!src)return false;var tick=String(node.getAttribute('data-tick')||''),existing=d.getElementById('v495LivePriceCell'),color=direction==='DOWN'?RED:GREEN;if(existing&&lastCellTick===tick&&existing.getAttribute('data-direction')===direction){existing.setAttribute('data-price',Number(price).toFixed(2));return true;}removeOverlay(d);var o=src.cloneNode(false);o.id='v495LivePriceCell';o.removeAttribute('data-v131-cell-key');o.removeAttribute('data-state');o.setAttribute('pointer-events','none');o.setAttribute('aria-hidden','true');o.setAttribute('fill',color);o.setAttribute('fill-opacity','.86');o.setAttribute('stroke',direction==='DOWN'?'#8B0B16':'#087A2E');o.setAttribute('stroke-width','4.2');o.setAttribute('stroke-opacity','1');o.setAttribute('data-direction',direction);o.setAttribute('data-price',Number(price).toFixed(2));o.style.setProperty('fill',color,'important');o.style.setProperty('fill-opacity','.86','important');o.style.setProperty('opacity','1','important');o.style.setProperty('filter','drop-shadow(0 0 13px '+color+')','important');src.parentNode.appendChild(o);lastCellTick=tick;d.documentElement.dataset.v495GoldPrice=Number(price).toFixed(2);d.documentElement.dataset.v495GoldDirection=direction;return true;}
function endpointLabel(url){try{var u=new URL(url);return u.hostname+':'+u.port;}catch(e){return '8768/8770';}}
function paintBoard(online,price,direction){var p=board.querySelector('.price'),dir=board.querySelector('.direction'),state=board.querySelector('.state'),ep=board.querySelector('.endpoint');if(!online){board.dataset.mode='offline';p.textContent='--.--';dir.textContent='•';state.textContent='SEARCHING LIVE';ep.textContent=activeEndpoint?endpointLabel(activeEndpoint):'8768/8770';return;}board.dataset.mode=direction==='DOWN'?'down':'up';p.textContent=Number(price).toFixed(2);dir.textContent=direction==='DOWN'?'▼':'▲';state.textContent=direction==='DOWN'?'LIVE DOWN':'LIVE UP';ep.textContent=endpointLabel(activeEndpoint);}
async function fetchQuote(url){var c=typeof AbortController==='function'?new AbortController():null,t=setTimeout(function(){try{c&&c.abort();}catch(e){}},TIMEOUT_MS);try{var r=await fetch(url+(url.indexOf('?')<0?'?':'&')+'_v495='+Date.now(),{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',headers:{'Accept':'application/json'},signal:c?c.signal:undefined});if(!r.ok)throw new Error('HTTP '+r.status);var q=quoteData(await r.json());if(!q)throw new Error('NO_VALID_PRICE');return q;}finally{clearTimeout(t);}}
async function scanQuote(){var order=[];if(activeEndpoint)order.push(activeEndpoint);for(var i=0;i<ENDPOINTS.length;i++)if(ENDPOINTS[i]!==activeEndpoint)order.push(ENDPOINTS[(i+scanIndex)%ENDPOINTS.length]);for(var j=0;j<order.length;j++){try{var q=await fetchQuote(order[j]);activeEndpoint=order[j];scanIndex=(ENDPOINTS.indexOf(activeEndpoint)+1)%ENDPOINTS.length;return q;}catch(e){lastError=String(e&&e.message||e);}}return null;}
async function poll(){if(busy)return;busy=true;try{var q=await scanQuote();if(q){var direction=q.direction;if(direction!=='UP'&&direction!=='DOWN'){if(lastPrice!==null&&q.price<lastPrice)direction='DOWN';else if(lastPrice!==null&&q.price>lastPrice)direction='UP';else direction=lastDirection||'UP';}lastDirection=direction;lastPrice=q.price;lastGood=Date.now();success++;consecutiveFailures=0;hideLegacy();applyAnchor(q.price);paintCell(q.price,direction);paintBoard(true,q.price,direction);}else{errors++;consecutiveFailures++;if(consecutiveFailures>=RESCAN_AFTER_FAILURES)activeEndpoint=null;if(Date.now()-lastGood>OFFLINE_MS)paintBoard(false,null,lastDirection);}}catch(e){errors++;consecutiveFailures++;lastError=String(e&&e.message||e);if(consecutiveFailures>=RESCAN_AFTER_FAILURES)activeEndpoint=null;if(Date.now()-lastGood>OFFLINE_MS)paintBoard(false,null,lastDirection);}finally{busy=false;}}
frame.addEventListener('load',function(){setTimeout(function(){hideLegacy();poll();},180);});
setInterval(poll,POLL_MS);setInterval(function(){try{hideLegacy();if(lastPrice!==null){applyAnchor(lastPrice);paintCell(lastPrice,lastDirection);}}catch(e){}},900);poll();
window.__auditV495Gold=function(){return{symbol:'XAUUSD',mode:lastGood&&Date.now()-lastGood<OFFLINE_MS?'LIVE':'WAITING',lastPrice:lastPrice,lastDirection:lastDirection,activeEndpoint:activeEndpoint,pollMs:POLL_MS,timeoutMs:TIMEOUT_MS,anchorApplied:anchorApplied,liveCellTick:lastCellTick,successCount:success,errorCount:errors,consecutiveFailures:consecutiveFailures,lastError:lastError,endpoints:ENDPOINTS.slice(),twoDecimalBoard:true,clockwiseUpGreen:true,counterClockwiseDownRed:true,fixedWheelNumbers:true};};
}());
