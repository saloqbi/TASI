<script>
(function(){
'use strict';
var frame=document.getElementById('v494-frame'),board=document.getElementById('v494Board');
var URL='http://127.0.0.1:8768/quote',POLL_MS=200,TIMEOUT_MS=1600,OFFLINE_MS=2600;
var GREEN='#20C85A',RED='#E53945',busy=false,lastPrice=null,lastDirection='UP',lastGood=0,lastCellTick=null,anchorApplied=false,success=0,errors=0;
function visit(doc,fn,depth){if(!doc||depth>800)return null;var hit=fn(doc);if(hit)return hit;var fs=doc.querySelectorAll('iframe');for(var i=0;i<fs.length;i++){try{var x=visit(fs[i].contentDocument,fn,depth+1);if(x)return x;}catch(e){}}return null;}
function root(){try{return frame.contentDocument;}catch(e){return null;}}
function controlDoc(){var r=root();return r&&visit(r,function(d){return d.querySelector('input[aria-label="Value"]')?d:null;},0);}

function nodeValue(n){var p=n.querySelector('tspan[data-v131-number-role="primary"]'),a=[n.getAttribute('data-v131-display-value'),p&&p.textContent,n.textContent];for(var i=0;i<a.length;i++){var x=western(a[i]);if(x!==null)return x;}return null;}
function nativeSet(input,value){var w=input.ownerDocument.defaultView,p=w.HTMLInputElement&&w.HTMLInputElement.prototype,ds=p&&Object.getOwnPropertyDescriptor(p,'value');if(ds&&ds.set)ds.set.call(input,String(value));else input.value=String(value);['input','change','keyup','blur'].forEach(function(n){input.dispatchEvent(new w.Event(n,{bubbles:true}));});}
function applyAnchor(price){if(anchorApplied)return true;var d=controlDoc(),input=d&&d.querySelector('input[aria-label="Value"]');if(!input)return false;var anchor=Math.max(1,Math.floor(Number(price)));var r=root(),engine=r&&visit(r,function(doc){var w=doc.defaultView;return w&&typeof w.__setKawkabatCanonicalValue==='function'?w:null;},0);if(engine)engine.__setKawkabatCanonicalValue(String(anchor));else nativeSet(input,String(anchor));anchorApplied=true;return true;}
function hideLegacy(){var r=root();if(!r)return;visit(r,function(d){var s=d.getElementById('v494HideLegacy');if(!s){s=d.createElement('style');s.id='v494HideLegacy';s.textContent='#v482CleanLiveStatus,#v489AmiBrokerSymbolSelector{display:none!important}';d.head&&d.head.appendChild(s);}return null;},0);}
function findNode(doc,price){var target=Math.floor(Number(price)),nodes=doc.querySelectorAll('.approved-cycle-number[data-tick]'),best=null,bestDelta=Infinity;for(var i=0;i<nodes.length;i++){var v=nodeValue(nodes[i]);if(v===null)continue;var delta=Math.abs(v-target);if(delta<bestDelta){best=nodes[i];bestDelta=delta;}if(delta<1e-9)break;}return bestDelta<=0.51?best:null;}

function removeOverlay(doc){var ids=['v484LivePriceCell','v486LivePriceCell','v490LivePriceCell','v493LivePriceCell','v494LivePriceCell'];for(var i=0;i<ids.length;i++){var old=doc&&doc.getElementById(ids[i]);if(old)old.remove();}}
function paintCell(price,direction){var d=wheelDoc();if(!d)return false;var node=findNode(d,price);if(!node){removeOverlay(d);return false;}var src=matchingPath(d,node);if(!src)return false;var tick=String(node.getAttribute('data-tick')||''),existing=d.getElementById('v494LivePriceCell'),color=direction==='DOWN'?RED:GREEN;if(existing&&lastCellTick===tick&&existing.getAttribute('data-direction')===direction)return true;removeOverlay(d);var o=src.cloneNode(false);o.id='v494LivePriceCell';o.removeAttribute('data-v131-cell-key');o.removeAttribute('data-state');o.setAttribute('pointer-events','none');o.setAttribute('fill',color);o.setAttribute('fill-opacity','.84');o.setAttribute('stroke',direction==='DOWN'?'#8B0B16':'#087A2E');o.setAttribute('stroke-width','4');o.setAttribute('data-direction',direction);o.style.setProperty('fill',color,'important');o.style.setProperty('fill-opacity','.84','important');o.style.setProperty('filter','drop-shadow(0 0 12px '+color+')','important');src.parentNode.appendChild(o);lastCellTick=tick;d.documentElement.dataset.v494GoldPrice=Number(price).toFixed(2);d.documentElement.dataset.v494GoldDirection=direction;return true;}
function paintBoard(online,price,direction){var p=board.querySelector('.price'),dir=board.querySelector('.direction'),state=board.querySelector('.state');if(!online){board.dataset.mode='waiting';p.textContent='--.--';dir.textContent='•';state.textContent='CONNECT GOLD';return;}board.dataset.mode=direction==='DOWN'?'down':'up';p.textContent=Number(price).toFixed(2);dir.textContent=direction==='DOWN'?'▼':'▲';state.textContent=direction==='DOWN'?'LIVE DOWN':'LIVE UP';}
async function readQuote(){var c=typeof AbortController==='function'?new AbortController():null,t=setTimeout(function(){try{c&&c.abort();}catch(e){}},TIMEOUT_MS);try{var r=await fetch(URL+'?_v494='+Date.now(),{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',headers:{'Accept':'application/json','Cache-Control':'no-cache'},signal:c?c.signal:undefined});if(!r.ok)throw new Error('HTTP '+r.status);var j=await r.json(),price=western(j.price);if(price===null||price<=0)throw new Error('NO_PRICE');return{price:price,direction:String(j.direction||'').toUpperCase()};}finally{clearTimeout(t);}}
async function poll(){if(busy)return;busy=true;try{var q=await readQuote(),direction=q.direction;if(direction!=='UP'&&direction!=='DOWN'){if(lastPrice!==null&&q.price<lastPrice)direction='DOWN';else if(lastPrice!==null&&q.price>lastPrice)direction='UP';else direction=lastDirection||'UP';}lastDirection=direction;lastPrice=q.price;lastGood=Date.now();success++;hideLegacy();applyAnchor(q.price);paintCell(q.price,direction);paintBoard(true,q.price,direction);}catch(e){errors++;if(Date.now()-lastGood>OFFLINE_MS)paintBoard(false,null,lastDirection);}finally{busy=false;}}
