<style>

#v493-frame{display:block;width:100%;height:100%;border:0}
#v493Board{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647;min-width:300px;height:42px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 15px;border:1px solid #8a641e;border-radius:9px;background:#fff7dc;color:#65470f;font:800 15px Arial,Tahoma,sans-serif;direction:ltr;white-space:nowrap;box-shadow:0 2px 9px rgba(0,0,0,.24);pointer-events:none}

<body>
<div id="v493Board" data-mode="waiting" role="status" aria-live="polite">
 <span class="symbol">AMIBROKER</span><span class="price">--.--</span><span class="direction">•</span><span class="state">CONNECT BRIDGE</span><span class="port">8768</span>
</div>
<iframe id="v493-frame" title="كوكبة الأرقام السحرية" src="https://htmlpreview.github.io/?https://github.com/KawkabatSeherAlarqam-Org/KawkabatSeherAlarqam/blob/main/public/kawkabat-al-arqam-al-sihria-v489-amibroker-live-final-clean.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('v493-frame'),board=document.getElementById('v493Board');
var ENDPOINTS=['http://127.0.0.1:8768/quote','http://127.0.0.1:8770/quote'];
var POLL_MS=220,TIMEOUT_MS=950,OFFLINE_MS=2400;
var GREEN='#20C85A',RED='#E53945';
var activeEndpoint=null,busy=false,lastPrice=null,lastDirection='UP',lastGood=0,lastCellTick=null,lastCellValue=null,paintCount=0,errorCount=0,successCount=0;

function visit(doc,fn,depth){if(!doc||depth>800)return null;var hit=fn(doc);if(hit)return hit;var fs=doc.querySelectorAll('iframe');for(var i=0;i<fs.length;i++){try{var x=visit(fs[i].contentDocument,fn,depth+1);if(x)return x;}catch(e){}}return null;}
function root(){try{return frame.contentDocument;}catch(e){return null;}}
function wheelDoc(){var r=root();return r&&visit(r,function(d){return d.getElementById('wheel')&&d.querySelector('.approved-cycle-number[data-tick]')?d:null;},0);}
function controlDoc(){var r=root();return r&&visit(r,function(d){return d.querySelector('input[aria-label="Value"]')?d:null;},0);}
function western(v){var m={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};var t=String(v==null?'':v).replace(/[٠-٩۰-۹]/g,function(d){return m[d]||d;}).replace(/,/g,'').trim();var n=Number(t);return Number.isFinite(n)?n:null;}
function quoteData(p){if(p==null)return null;if(typeof p==='number'||typeof p==='string'){var s=western(p);return s!==null&&s>0?{price:s,symbol:'XAUUSD',direction:null,port:null}:null;}var c=[p.price,p.last,p.close,p.value,p.ltp,p.LTP];if(p.quote)c.push(p.quote.price,p.quote.last,p.quote.close,p.quote.value,p.quote.ltp,p.quote.LTP);if(p.data)c.push(p.data.price,p.data.last,p.data.close,p.data.value,p.data.ltp,p.data.LTP);var price=null;for(var i=0;i<c.length;i++){var n=western(c[i]);if(n!==null&&n>0){price=n;break;}}if(price===null)return null;var symbol=String(p.symbol||(p.quote&&p.quote.symbol)||(p.data&&p.data.symbol)||'XAUUSD').trim().toUpperCase();var direction=String(p.direction||(p.quote&&p.quote.direction)||(p.data&&p.data.direction)||'').trim().toUpperCase();if(direction!=='UP'&&direction!=='DOWN')direction=null;return{price:price,symbol:symbol,direction:direction,port:p.port||null};}
function nodeValue(node){var p=node.querySelector('tspan[data-v131-number-role="primary"]'),arr=[node.getAttribute('data-v131-display-value'),p&&p.textContent,node.textContent];for(var i=0;i<arr.length;i++){var n=western(arr[i]);if(n!==null)return n;}return null;}
function findPriceNode(doc,price){var nodes=doc.querySelectorAll('.approved-cycle-number[data-tick]'),items=[];for(var i=0;i<nodes.length;i++){var v=nodeValue(nodes[i]);if(v!==null)items.push({node:nodes[i],value:v});}if(!items.length)return null;items.sort(function(a,b){return a.value-b.value;});var unique=[];for(var j=0;j<items.length;j++){if(!unique.length||Math.abs(items[j].value-unique[unique.length-1].value)>1e-9)unique.push(items[j]);}if(price<unique[0].value)return null;var steps=[];for(var k=1;k<unique.length;k++){var d=unique[k].value-unique[k-1].value;if(d>1e-9)steps.push(d);}steps.sort(function(a,b){return a-b;});var step=steps.length?steps[Math.floor(steps.length/2)]:1;if(price>=unique[unique.length-1].value+step)return null;var lo=0,hi=unique.length-1;while(lo<=hi){var mid=(lo+hi)>>1;if(unique[mid].value<=price)lo=mid+1;else hi=mid-1;}return unique[Math.max(0,hi)].node;}
function matchingPath(doc,node){var tick=String(node.getAttribute('data-tick')||''),paths=doc.querySelectorAll('#v131CellColorLayer path[data-v131-cell-key]');for(var i=0;i<paths.length;i++){var key=String(paths[i].getAttribute('data-v131-cell-key')||'');if(key.slice(-(tick.length+1))==='|'+tick)return paths[i];}var x=Number(node.getAttribute('x')),y=Number(node.getAttribute('y'));if(!Number.isFinite(x)||!Number.isFinite(y))return null;var ta=Math.atan2(y-1800,x-2200)*180/Math.PI,tr=Math.hypot(x-2200,y-1800),best=null,score=Infinity;for(var j=0;j<paths.length;j++){try{var b=paths[j].getBBox(),px=b.x+b.width/2,py=b.y+b.height/2,a=Math.atan2(py-1800,px-2200)*180/Math.PI,r=Math.hypot(px-2200,py-1800),da=Math.abs(a-ta);da=Math.min(da,360-da);var s=da*20+Math.abs(r-tr);if(s<score){best=paths[j];score=s;}}catch(e){}}return best;}
function removeOld(doc){if(!doc)return;['v484LivePriceCell','v486LivePriceCell','v490LivePriceCell','v492LivePriceCell','v493LivePriceCell'].forEach(function(id){var n=doc.getElementById(id);if(n)n.remove();});}
function paintCell(price,direction){var doc=wheelDoc();if(!doc)return false;var node=findPriceNode(doc,price);if(!node){removeOld(doc);lastCellTick=null;lastCellValue=null;return false;}var source=matchingPath(doc,node);if(!source)return false;var tick=String(node.getAttribute('data-tick')||''),existing=doc.getElementById('v493LivePriceCell'),color=direction==='DOWN'?RED:GREEN;if(existing&&existing.isConnected&&lastCellTick===tick&&existing.getAttribute('data-direction')===direction){existing.setAttribute('data-price',price.toFixed(2));lastCellValue=nodeValue(node);return true;}removeOld(doc);var overlay=source.cloneNode(false);overlay.id='v493LivePriceCell';overlay.removeAttribute('data-v131-cell-key');overlay.removeAttribute('data-state');overlay.setAttribute('pointer-events','none');overlay.setAttribute('aria-hidden','true');overlay.setAttribute('fill',color);overlay.setAttribute('fill-opacity','0.82');overlay.setAttribute('stroke',direction==='DOWN'?'#850814':'#087A2E');overlay.setAttribute('stroke-width','4.5');overlay.setAttribute('stroke-opacity','1');overlay.setAttribute('data-direction',direction);overlay.setAttribute('data-price',price.toFixed(2));overlay.style.setProperty('fill',color,'important');overlay.style.setProperty('fill-opacity','0.82','important');overlay.style.setProperty('opacity','1','important');overlay.style.setProperty('filter','drop-shadow(0 0 15px '+color+')','important');source.parentNode.appendChild(overlay);node.setAttribute('data-v493-live-price',price.toFixed(2));doc.documentElement.dataset.v493LivePrice=price.toFixed(2);doc.documentElement.dataset.v493LiveDirection=direction;doc.documentElement.dataset.v493LiveCellValue=String(nodeValue(node));lastCellTick=tick;lastCellValue=nodeValue(node);paintCount++;return true;}
function hideNestedStatus(){var d=controlDoc();if(!d)return;var style=d.getElementById('v493HideNestedStatus');if(!style){style=d.createElement('style');style.id='v493HideNestedStatus';style.textContent='#v482CleanLiveStatus,#v490LowLatencyStatus{display:none!important}';d.head.appendChild(style);}}
function paintBoard(q,direction,online){var symbol=board.querySelector('.symbol'),price=board.querySelector('.price'),dir=board.querySelector('.direction'),state=board.querySelector('.state'),port=board.querySelector('.port');if(!online||!q){board.dataset.mode='waiting';symbol.textContent='AMIBROKER';price.textContent='--.--';dir.textContent='•';state.textContent='CONNECT BRIDGE';port.textContent='8768';return;}var down=direction==='DOWN';board.dataset.mode=down?'down':'up';symbol.textContent=q.symbol;price.textContent=Number(q.price).toFixed(2);dir.textContent=down?'▼':'▲';state.textContent=down?'LIVE DOWN':'LIVE UP';var ep=activeEndpoint||'';port.textContent=q.port?String(q.port):(ep.indexOf(':8770')>=0?'8770':'8768');}
async function read(url){var c=typeof AbortController==='function'?new AbortController():null,t=setTimeout(function(){try{if(c)c.abort();}catch(e){}},TIMEOUT_MS);try{var r=await fetch(url+(url.indexOf('?')<0?'?':'&')+'_v493='+Date.now(),{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',headers:{'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache'},signal:c?c.signal:undefined});if(!r.ok)throw new Error('HTTP '+r.status);return quoteData(await r.json());}finally{clearTimeout(t);}}
async function getQuote(){var urls=activeEndpoint?[activeEndpoint].concat(ENDPOINTS.filter(function(u){return u!==activeEndpoint;})):ENDPOINTS.slice();for(var i=0;i<urls.length;i++){try{var q=await read(urls[i]);if(q&&q.price!==null){activeEndpoint=urls[i];return q;}}catch(e){errorCount++;}}return null;}
async function poll(){if(busy)return;busy=true;try{hideNestedStatus();var q=await getQuote();if(q){var direction=q.direction;if(direction!=='UP'&&direction!=='DOWN'){if(lastPrice!==null&&q.price<lastPrice)direction='DOWN';else if(lastPrice!==null&&q.price>lastPrice)direction='UP';else direction=lastDirection||'UP';}lastDirection=direction;lastPrice=q.price;lastGood=Date.now();successCount++;paintBoard(q,direction,true);paintCell(q.price,direction);var doc=wheelDoc();if(doc){doc.documentElement.dataset.amibrokerLive='true';doc.documentElement.dataset.amibrokerPrice=q.price.toFixed(2);doc.documentElement.dataset.amibrokerSymbol=q.symbol;}}else if(Date.now()-lastGood>OFFLINE_MS){paintBoard(null,lastDirection,false);}}catch(e){errorCount++;if(Date.now()-lastGood>OFFLINE_MS)paintBoard(null,lastDirection,false);}finally{busy=false;}}
function maintain(){try{hideNestedStatus();if(lastPrice!==null)paintCell(lastPrice,lastDirection);}catch(e){}}
frame.addEventListener('load',function(){setTimeout(function(){maintain();poll();},100);});
setInterval(poll,POLL_MS);setInterval(maintain,850);poll();
window.__auditV493=function(){return{mode:lastGood&&Date.now()-lastGood<OFFLINE_MS?'LIVE':'WAITING',lastPrice:lastPrice,lastPriceTwoDecimals:lastPrice===null?null:Number(lastPrice).toFixed(2),lastDirection:lastDirection,lastCellValue:lastCellValue,lastCellTick:lastCellTick,activeEndpoint:activeEndpoint,pollMs:POLL_MS,successCount:successCount,errorCount:errorCount,paintCount:paintCount,up:'green-clockwise',down:'red-counterclockwise',wheelNumbersRemainFixed:true,noLivePriceWriteIntoWheelValue:true};};
}());
</script>
